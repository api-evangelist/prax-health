aid: prax-health
name: Prax Health
description: >-
  Prax Health is a healthcare platform that helps nurse practitioners launch and
  grow their own independent practices. It provides an all-in-one back office that
  handles business formation, regulatory and clinical compliance, medical billing,
  insurance credentialing, an integrated EHR, and ongoing practice consulting. The
  company's stated mission is to put healthcare back in the hands of providers by
  removing the administrative and operational burden that keeps clinicians from
  practicing independently. Prax Health is a venture-backed company (Canaan Partners)
  and operates a consumer/clinician web application rather than a public developer
  platform; as of this profile it exposes no public API, SDKs, or developer
  documentation.
